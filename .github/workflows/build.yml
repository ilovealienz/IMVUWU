# Builds and tests IMVUWU on Windows, Linux and macOS on every push and pull
# request, and runs each download's built-in render checks on its own system
# (no window needed). A tag like v1.0.0 also publishes a GitHub release with
# the three downloads. These builds download IMVU's base avatars on first
# launch; the developer's IMVU avatar files are not in this repository.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Windows tests, the Windows download, and the Linux download
  # (cross-built with Zig for glibc 2.28+, i.e. older distros than any runner).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (open-source toolchain; fetches llvm-mingw)
        run: .\build.ps1 -Test
      - name: Build Windows, and Linux with Zig
        run: .\build.ps1
      - name: Run the Windows download's checks (CPU and software GPU)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist -Filter 'IMVUWU-*-no-imvu-avatars.exe' | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList '--render-check', 'smoke/cpu' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Get-ChildItem smoke/cpu -Filter *.png).Count -ne 6) { throw 'render check failed' }
          $p = Start-Process $exe -ArgumentList '--wgpu-render-check', 'smoke/gpu', '--software' -Wait -PassThru
          Get-Content smoke/gpu/report.txt, smoke/gpu/ERROR.txt -ErrorAction SilentlyContinue
          if (-not (Test-Path smoke/gpu/report.txt) -or (Test-Path smoke/gpu/ERROR.txt)) { throw 'GPU check failed' }
      - name: Name the downloads
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'IMVUWU-*-no-imvu-avatars.exe' | Select-Object -First 1
          $version = $exe.Name -replace '^IMVUWU-(.+)-no-imvu-avatars\.exe$', '$1'
          New-Item -ItemType Directory upload | Out-Null
          Copy-Item $exe.FullName "upload/IMVUWU-$version-windows-x86_64.exe"
          Copy-Item "dist/IMVUWU-$version-linux-x86_64-no-imvu-avatars.tar.gz" "upload/IMVUWU-$version-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-linux
          path: upload/*

  # Tests on real Linux, then runs the Linux download built by the Windows job.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desktop libraries for the tests, and Mesa's software Vulkan
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev mesa-vulkan-drivers
      - name: Test
        run: sh build.sh test
      - uses: actions/download-artifact@v4
        with:
          name: windows-and-linux
          path: downloads
      - name: Run the Linux download's checks (CPU and software GPU)
        run: |
          mkdir run
          tar -xzf downloads/IMVUWU-*-linux-x86_64.tar.gz -C run
          ./run/IMVUWU --render-check smoke/cpu
          test "$(ls smoke/cpu/*.png | wc -l)" -eq 6
          ./run/IMVUWU --wgpu-render-check smoke/gpu --software
          cat smoke/gpu/report.txt smoke/gpu/ERROR.txt 2>/dev/null || true
          test -f smoke/gpu/report.txt && test ! -f smoke/gpu/ERROR.txt

  # macOS tests, the macOS (Apple Silicon) download and its checks (Metal).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: sh build.sh test
      - name: Build
        run: sh build.sh
      - name: Run the macOS download's checks (CPU and GPU)
        run: |
          app=$(ls dist/IMVUWU-*-darwin-*-no-imvu-avatars)
          "$app" --render-check smoke/cpu
          test "$(ls smoke/cpu/*.png | wc -l)" -eq 6
          "$app" --wgpu-render-check smoke/gpu
          cat smoke/gpu/report.txt smoke/gpu/ERROR.txt 2>/dev/null || true
          test -f smoke/gpu/report.txt && test ! -f smoke/gpu/ERROR.txt
      - name: Name the download
        run: |
          mkdir upload
          for f in dist/IMVUWU-*-darwin-*-no-imvu-avatars.tar.gz; do
            name=$(basename "$f" | sed -e 's/-no-imvu-avatars//' -e 's/-darwin-/-macos-/')
            cp "$f" "upload/$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: upload/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "IMVUWU $GITHUB_REF_NAME" --generate-notes
